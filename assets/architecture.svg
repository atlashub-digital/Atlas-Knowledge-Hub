<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Atlas Knowledge Hub reference architecture</title>
<desc id="desc">Notion, Drive and GitHub connect to a permissioned source catalog and hybrid retrieval gateway, serving AtlasHub agents, AMF and isolated customer tenants.</desc>
<rect width="1200" height="490" rx="28" fill="#101827"/>
<text x="58" y="62" fill="#f8fafc" font-family="Arial,sans-serif" font-size="31" font-weight="700">ATLAS KNOWLEDGE HUB</text>
<text x="59" y="96" fill="#a5b4fc" font-family="Arial,sans-serif" font-size="16">Governed knowledge · Provenance · Tenant isolation · v0.1.1</text>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7dd3fc"/></marker></defs>
<rect x="55" y="158" width="263" height="170" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
<text x="78" y="194" fill="#f8fafc" font-family="Arial,sans-serif" font-size="22" font-weight="700">Canonical Sources</text>
<text x="78" y="233" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Notion · GitHub · Drive</text>
<text x="78" y="260" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Approved client APIs</text>
<text x="78" y="287" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Optional selected ADB</text>
<rect x="385" y="158" width="390" height="170" rx="16" fill="#1e40af" stroke="#60a5fa" stroke-width="2"/>
<text x="410" y="195" fill="#f8fafc" font-family="Arial,sans-serif" font-size="23" font-weight="700">Knowledge Core</text>
<text x="410" y="229" fill="#dbeafe" font-family="Arial,sans-serif" font-size="17">Ingestion · Versioning · Provenance</text>
<text x="410" y="259" fill="#dbeafe" font-family="Arial,sans-serif" font-size="17">Postgres FTS + pgvector (proposed)</text>
<text x="410" y="290" fill="#dbeafe" font-family="Arial,sans-serif" font-size="17">Tenant ACL · Retrieval · Citations</text>
<rect x="840" y="136" width="309" height="66" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
<text x="865" y="176" fill="#ecfdf5" font-family="Arial,sans-serif" font-size="19">AI Workforce / Hermes</text>
