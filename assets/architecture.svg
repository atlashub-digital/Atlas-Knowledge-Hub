<path d="M775 243 H809 V169 H836 M809 243 V253 H836 M809 243 V336 H836" stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<text x="58" y="412" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="16">Data ownership stays with each unit and customer. Derived indexes are disposable.</text>
<text x="58" y="444" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Research architecture · Not a live deployment</text>
