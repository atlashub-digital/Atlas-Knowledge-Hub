<text x="865" y="260" fill="#ecfdf5" font-family="Arial,sans-serif" font-size="19">AMF · permitted discovery</text>
<rect x="840" y="303" width="309" height="66" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
<text x="865" y="342" fill="#ecfdf5" font-family="Arial,sans-serif" font-size="19">Ventures / Client tenants</text>
